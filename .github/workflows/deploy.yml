name: Release
run-name: Release ${{ github.ref_name }} by @${{ github.actor }}

on:
    push:
        tags: ["v*"]

permissions:
    contents: read

concurrency:
    group: production-release
    cancel-in-progress: false

jobs:
    verify:
        runs-on: ubuntu-24.04
        outputs:
            commit: ${{ steps.commit.outputs.sha }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Verify release commit belongs to main
              id: commit
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  COMMIT=$(bash scripts/verify-release.sh)
                  echo "sha=$COMMIT" >> "$GITHUB_OUTPUT"

    validate:
        needs: verify
        permissions:
            contents: read
            packages: write
        uses: ./.github/workflows/validate.yml
        with:
            publish-image: true

    promote:
        runs-on: ubuntu-24.04
        needs: [verify, validate]
        permissions:
            contents: read
            packages: write
        steps:
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Attach release tag to tested digest
              env:
                  IMAGE: ${{ needs.validate.outputs.image }}
                  DIGEST: ${{ needs.validate.outputs.digest }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  [[ "$RELEASE_TAG" =~ ^v[A-Za-z0-9_.-]+$ ]]
                  docker buildx imagetools create --prefer-index=false \
                      --tag "$IMAGE:$RELEASE_TAG" "$IMAGE@$DIGEST"

    deploy:
        runs-on: ubuntu-24.04
        needs: [verify, validate, promote]
        timeout-minutes: 15
        environment: production
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ needs.verify.outputs.commit }}
                  persist-credentials: false
            - name: Deploy tested digest and matching source revision
              env:
                  EC2_HOST: ${{ secrets.EC2_HOST }}
                  EC2_USER: ${{ secrets.EC2_USER }}
                  EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
                  EC2_HOST_KEY: ${{ secrets.EC2_HOST_KEY }}
                  GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
                  GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
                  APP_IMAGE_REF: ${{ needs.validate.outputs.image }}@${{ needs.validate.outputs.digest }}
                  RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: bash scripts/deploy.sh
