name: Validation Pipeline

on:
    pull_request:
        branches:
            - main
            - prod
    push:
        branches:
            - tests/*

permissions:
    contents: read

env:
    CI_COMPOSE_PATH: ./docker/ci/docker-compose.ci.yml

jobs:
    build:
        runs-on: ubuntu-24.04

        steps:
            - name: Pull the current branch
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build image with cache
              uses: docker/build-push-action@v7
              with:
                  context: .
                  load: true
                  tags: spotacus:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - run: docker image ls

            - name: Boot up laravel and test code
              run: |
                  docker compose -f ${{env.CI_COMPOSE_PATH}} up -d
                  docker compose -f ${{env.CI_COMPOSE_PATH}} exec -T app bash -lc '
                    set -e
                    ls
                    composer install --no-progress --no-interaction --prefer-dist
                    php artisan migrate:fresh --seed --force
                    php artisan test
                    '

            - run: echo test finsihed

            # login to a registry

            # push it to a registry

            # get the tags to identify the build image

