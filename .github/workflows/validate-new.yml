name: Validation Pipeline

on:
    pull_request:
        branches:
            - main
            - prod
    push:
        branches:
            - tests/*

permissions:
    contents: read
    # so we can push to registry
    packages: write

env:
    CI_COMPOSE_PATH: ./docker/ci/docker-compose.ci.yml
    GITHUB_REPO: "johnpi21"
    IMAGE_NAME: "spotacus"
    REGISTRY_URL: "ghcr.io/johnpi21/spotter"

jobs:
    build:
        runs-on: ubuntu-24.04

        outputs:
            identifier_tag: ${{env.REGISTRY_URL}}:${{github.sha}}

        steps:
            - name: Pull the current branch
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build image with cache
              uses: docker/build-push-action@v7
              with:
                  context: .
                  load: true
                  tags: |
                      ${{env.REGISTRY_URL}}:${{github.sha}}
                      ${{env.REGISTRY_URL}}:spotacus:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - run: docker image ls

            - name: Boot up laravel and test code
              run: |
                  docker compose -f ${{env.CI_COMPOSE_PATH}} up -d
                  docker compose -f ${{env.CI_COMPOSE_PATH}} exec -T app bash -lc '
                    set -e
                    ls
                    composer install --no-progress --no-interaction --prefer-dist
                    php artisan migrate:fresh --seed --force
                    php artisan test
                    '
                  docker compose -f ${{env.CI_COMPOSE_PATH}} down -v

            - run: echo test finished succesfully

            - name: Login to Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{github.actor}}
                  password: ${{secrets.GITHUB_TOKEN}}

            - name: Push to registry
              run: |
                  docker push ${{env.REGISTRY_URL}}:${{github.sha}}
                  docker push ${{env.REGISTRY_URL}}:spotacus:latest
                  docker image ls ghcr.io/johnpi21/spotter

            # get the tags to identify the build image

    # test:
    # login to a registry again

    # pull the image

    # run it

    # start testing it
