name: Build and Validate

on:
    workflow_call:
        inputs:
            publish-image:
                type: boolean
                default: false
        outputs:
            image:
                value: ${{ jobs.validate.outputs.image }}
            digest:
                value: ${{ jobs.validate.outputs.digest }}

jobs:
    validate:
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        outputs:
            image: ${{ steps.image.outputs.name }}
            digest: ${{ steps.build.outputs.digest }}
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Name candidate image
              id: image
              env:
                  REPOSITORY: ${{ github.repository }}
              run: |
                  IMAGE="ghcr.io/${REPOSITORY,,}"
                  echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
                  echo "tag=$IMAGE:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

            - uses: docker/setup-buildx-action@v3

            - name: Authenticate for release publishing
              if: inputs.publish-image
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build application image before installing test tooling
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  push: ${{ inputs.publish-image }}
                  load: ${{ !inputs.publish-image }}
                  tags: ${{ steps.image.outputs.tag }}
                  cache-from: type=gha,scope=application
                  cache-to: type=gha,mode=max,scope=application

            - name: Select artifact for validation
              env:
                  PUBLISH_IMAGE: ${{ inputs.publish-image }}
                  IMAGE: ${{ steps.image.outputs.name }}
                  DIGEST: ${{ steps.build.outputs.digest }}
                  LOCAL_IMAGE: ${{ steps.image.outputs.tag }}
              run: |
                  if [ "$PUBLISH_IMAGE" = true ]; then
                      [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
                      APP_IMAGE_REF="$IMAGE@$DIGEST"
                      docker pull "$APP_IMAGE_REF"
                  else
                      APP_IMAGE_REF="$LOCAL_IMAGE"
                  fi
                  echo "APP_IMAGE_REF=$APP_IMAGE_REF" >> "$GITHUB_ENV"
                  echo "COMPOSE_PROJECT_NAME=ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: npm

            - name: Quality, unit, database, and production runtime checks
              run: bash scripts/ci.sh

            - name: Record tested artifact
              if: inputs.publish-image
              env:
                  IMAGE: ${{ steps.image.outputs.name }}
                  DIGEST: ${{ steps.build.outputs.digest }}
              run: |
                  printf 'Commit: `%s`\n\nTested image: `%s@%s`\n' "$GITHUB_SHA" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
