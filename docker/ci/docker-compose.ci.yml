services:
    app:
        image: ${APP_IMAGE_REF:?Set the built image reference}
        env_file: .env.ci
        working_dir: /var/www/html
        depends_on:
            mysql:
                condition: service_healthy
        volumes:
            - vendor-ci:/var/www/html/vendor
            - ./.env.ci:/var/www/html/.env:ro
        networks: [ci_net]

    runtime:
        image: ${APP_IMAGE_REF:?Set the built image reference}
        env_file: .env.ci
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
        volumes:
            - public-ci:/var/www/html/public
        depends_on:
            mysql:
                condition: service_healthy
        networks: [ci_net]

    nginx:
        image: nginx:alpine
        ports:
            - "127.0.0.1:${CI_HTTP_PORT:-8080}:80"
        volumes:
            - public-ci:/var/www/html/public:ro
            - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            runtime:
                condition: service_healthy
        networks: [ci_net]

    mysql:
        image: mysql:8.4
        command:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --skip-log-bin
            - --skip-name-resolve
            - --innodb-buffer-pool-size=128M
            - --max-connections=50
            - --performance-schema=OFF
        environment:
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_DATABASE: testing
            MYSQL_USER: ci_user
            MYSQL_PASSWORD: ci_pass
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psecret"]
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 30s
        volumes:
            - type: tmpfs
              target: /var/lib/mysql
        networks: [ci_net]

networks:
    ci_net: {}

volumes:
    vendor-ci: {}
    public-ci: {}
